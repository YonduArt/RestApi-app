<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${country.name}">Страна</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1 th:text="${country.name}">Страна</h1>
            <div class="header-actions">
                <a th:href="@{/}" class="btn btn-secondary">← Назад к списку</a>
                <a th:href="@{/country/{id}/edit(id=${country.id})}" class="btn btn-warning">✏️ Редактировать</a>
            </div>
        </header>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="country-detail">
            <div class="detail-card">
                <div class="detail-header">
                    <h2 th:text="${country.name}">Название страны</h2>
                    <span class="country-id">ID: <span th:text="${country.id}">0</span></span>
                </div>
                <div class="detail-info">
                    <div class="info-item">
                        <span class="label">👥 Население:</span>
                        <span class="value" th:text="${#numbers.formatDecimal(country.population, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">🏙️ Количество городов:</span>
                        <span class="value" th:text="${country.cities.size()}">0</span>
                    </div>
                    <div class="cities-list" th:if="${!country.cities.empty}">
                        <h3>Города:</h3>
                        <ul>
                            <li th:each="city : ${country.cities}" th:text="${city.name}">Город</li>
                        </ul>
                    </div>
                    <div class="cities-list" th:if="${country.cities.empty}">
                        <p class="no-cities">Города не указаны</p>
                    </div>
                </div>
                <div class="detail-actions">
                    <a th:href="@{/country/{id}/edit(id=${country.id})}" class="btn btn-warning">✏️ Редактировать</a>
                    <form th:action="@{/country/{id}/delete(id=${country.id})}" method="post" style="display: inline;" onsubmit="return confirm('Вы уверены, что хотите удалить эту страну?')">
                        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
